<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="sticky-header">
        <h1>Expense Tracker</h1>
    </header>
    <div class="container">
        <div class="sticky-form">
            <form id="expense-form">
                <div class="section-heading">Add Expense</div>
                <input type="text" id="category" placeholder="Category (default: Malicious)">
                <input type="number" id="amount" placeholder="Amount" min="0" step="0.01" required>
                <input type="date" id="date" placeholder="Date (default: Today)">
                <button type="submit">Add Expense</button>
            </form>
        </div>
        <div class="main-content">
            <div class="left-panel">
                <div class="filters-card">
                    <div class="section-heading">Filters</div>
                    <div class="filters-grid">
                        <select id="sort-select">
                            <option value="date-asc">Sort by Date (Oldest)</option>
                            <option value="date-desc">Sort by Date (Newest)</option>
                            <option value="amount-asc">Sort by Amount (Low-High)</option>
                            <option value="amount-desc">Sort by Amount (High-Low)</option>
                            <option value="category">Sort by Category</option>
                            <option value="category-date">Sort by Category, then Date</option>
                        </select>
                        <input type="text" id="filter-category" placeholder="Category">
                        <input type="month" id="filter-month" placeholder="Month">
                        <input type="number" id="filter-min" placeholder="Min Amount" min="0" step="0.01">
                        <input type="number" id="filter-max" placeholder="Max Amount" min="0" step="0.01">
                        <button id="apply-filters" type="button">Apply</button>
                        <button id="clear-filters" type="button">Clear</button>
                    </div>
                </div>
                <div class="total-section">
                    <div class="section-heading">Total</div>
                    <div id="total-amount"></div>
                    <div id="total-by-category"></div>
                    <div id="monthly-summary"></div>
                    <div id="average-daily"></div>
                </div>
            </div>
            <div class="right-panel">
                <div class="section-heading">Expense List</div>
                <div class="table-container">
                    <table id="expenses-table">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Expenses will be inserted here -->
                        </tbody>
                    </table>
                </div>
                <div class="file-section">
                    <div class="section-heading">File Upload & Export</div>
                    <input type="file" id="upload-file" accept=".txt,.xlsx">
                    <button id="upload-btn" type="button">Upload & Merge</button>
                    <button id="export-btn" type="button">Export expense.txt</button>
                    <div id="file-message"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
